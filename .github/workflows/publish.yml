name: Publish Release

on:
  release:
    types:
      - published

jobs:
  build:
    if: github.repository_owner == 'amiralimollaei'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          check-latest: true

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build (Release)
        run: ./gradlew build -Pbuild.release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      - name: Publish Fabric to Modrinth, CurseForge & GitHub
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: iuZL1bXB
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1533871
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: '[Fabric] ${{ github.event.release.name }}'
          version: '${{ github.event.release.tag_name }}+fabric'
          version-type: release

          loaders: fabric

          dependencies: |
            vulkanmod
            fabric-api(optional)
            bobby(optional)

          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|dev-shadow)).jar
            fabric/build/libs/*-@(dev|sources|javadoc|dev-shadow).jar
